addEventListener("keyup",e=>keys[e.key.toLowerCase()]=0);
function makePerson(v,sg){
 const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:v&&sg.includes("pale")?0xa3ad9d:pick([0xd9b49a,0xa87454,0x7a5239,0xe8cbb4])}),cl=new THREE.MeshStandardMaterial({color:pick([0x3b4a6b,0x5b3a3a,0x3f5a46,0x6a6a6a])});
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.34,.42,1.25,12),cl);body.position.y=.82;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.23,16,12),skin);head.position.y=1.68;
 const eyeM=new THREE.MeshBasicMaterial({color:0x050505}),eyes=[-1,1].map(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyeM);const big=v&&sg.includes("eyes");e.userData.b=big?1.6:1;e.scale.setScalar(e.userData.b);e.position.set(s*(big?.1:.08),1.72,.2);return e});
 const mouth=new THREE.Mesh(new THREE.BoxGeometry(.11,.025,.02),new THREE.MeshBasicMaterial({color:0x300808}));mouth.position.set(0,1.6,.215);
 if(v&&sg.includes("grin")){mouth.scale.x=2.4;mouth.scale.y=1.6}
 const teeth=new THREE.Mesh(new THREE.BoxGeometry(.22,.018,.01),new THREE.MeshBasicMaterial({color:0xcfcfc0}));teeth.position.set(0,1.612,.219);teeth.visible=!!(v&&sg.includes("grin"));
 const hg=new THREE.Group();hg.position.y=1.45;[head,mouth,teeth,...eyes].forEach(o=>{o.position.y-=1.45;hg.add(o)});hg.rotation.z=v&&sg.includes("tilt")?(Math.random()<.5?1:-1)*.38:(Math.random()-.5)*.1;
 const al=v&&sg.includes("arms")?1.15:.72+Math.random()*.08;
 [-1,1].forEach(s=>{const a=new THREE.Mesh(new THREE.CylinderGeometry(.06,.05,al,8),cl);a.position.set(s*.46,1.38-al/2,0);g.add(a)});
 g.add(body,hg);
 g.traverse(o=>{if(o.isMesh)o.castShadow=!(v&&sg.includes("shadow"))});
 return {g,eyes,v,sg,nextBlink:2,blinkEnd:0,nerv:!v&&Math.random()<.3,t:0,breathT:0}}
function setPerson(p){if(P)scene.remove(P.g);P=p;p.g.position.set(0,0,-9);scene.add(p.g)}
function frame(ts){const t=ts/1000,dt=Math.min(t-t0,.05);t0=t;
 if(P){P.t+=dt;const z=P.g.position.z;if(z<-3&&!AN)P.g.position.z=Math.min(-3,z+dt*3);const zz=P.g.position.z;P.g.position.y=zz>-4.9?.2:zz>-5.4?.1:0;
  const st=P.v&&P.sg.includes("still");if(!AN){P.g.rotation.z=st?0:Math.sin(t*1.3)*.03;P.g.position.x=st?0:Math.sin(t*.7)*.04}
  if(!(P.v&&P.sg.includes("blink"))){const gap=P.nerv?.7:3.4;if(t>P.nextBlink){P.blinkEnd=t+.14;P.nextBlink=t+gap+Math.random()*1.5}P.eyes.forEach(e=>e.scale.y=(t<P.blinkEnd?.1:1)*(e.userData.b||1))}
  P.breathT+=dt;if(P.breathT>1.8&&P.g.position.z>=-3&&!AN&&!(P.v&&P.sg.includes("breath"))){P.breathT=0;const m=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xcfd8e0,transparent:true,opacity:.5}));m.position.set(P.g.position.x,1.78,-2.75);m.scale.setScalar(.6);scene.add(m);puffs.push(m)}}
 puffs=puffs.filter(m=>{m.position.y+=dt*.25;m.position.z+=dt*.25;m.scale.multiplyScalar(1+dt*1.6);m.material.opacity-=dt*.28;if(m.material.opacity<=0){scene.remove(m);return false}return true});
 const pk=S.peep;const f=pk?0:(keys.w?1:0)-(keys.s?1:0),r=pk?0:(keys.d?1:0)-(keys.a?1:0);
 yaw+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*dt*1.8;tPitch=Math.max(-1.2,Math.min(1,tPitch+((keys.arrowup?1:0)-(keys.arrowdown?1:0))*dt*1.5));
 if(!pk){const sp=2.2*dt;cam.position.x=Math.max(-3.6,Math.min(3.6,cam.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*sp));cam.position.z=Math.max(.3,Math.min(6.4,cam.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*sp))}
 cam.position.y=1.6+((f||r)?Math.sin(t*9)*.025:0);
 const away=!(cam.position.z<1.4&&Math.abs(cam.position.x)<1.3);if(away!==S.away){S.away=away;document.body.classList.toggle("away",away)}
 fire.intensity=1.1+Math.random()*.4;doorM.emissiveIntensity=(P&&S.away&&!S.peep)?.5+.4*Math.sin(t*5):.1;
 stepAnim(dt);
 if(pk&&P){const b=document.getElementById("bub"),v3=new THREE.Vector3(P.g.position.x+.4,P.g.position.y+1.95,P.g.position.z).project(cam);b.style.left=Math.max(8,Math.min(innerWidth-250,(v3.x*.5+.5)*innerWidth))+"px";b.style.top=Math.max(8,(-v3.y*.5+.5)*innerHeight-10)+"px"}
 if(pk){yaw=Math.max(-.45,Math.min(.45,yaw));tPitch=Math.max(-.7,Math.min(.15,tPitch))}
 pitch+=(tPitch-pitch)*Math.min(1,dt*5);cam.rotation.set(pitch,yaw,0);
 const fl=Math.random()<.01?.3:1;lamp.intensity=(AN&&AN.type==="kill")?(AN.t>2.4?0:(Math.random()<.25?.15:1.6)):1.6*fl;
 R.render(scene,cam);requestAnimationFrame(frame)}
cv.addEventListener("pointerdown",e=>drag={x:e.clientX,y:e.clientY,yw:yaw,pt:tPitch});
addEventListener("pointerup",()=>drag=null);
addEventListener("pointermove",e=>{if(!drag||document.pointerLockElement)return;yaw=drag.yw+(e.clientX-drag.x)*.004;tPitch=Math.max(-1.2,Math.min(1,drag.pt+(e.clientY-drag.y)*.004))});
function knock(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=85;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.5,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.15);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
// --- game
let S={};const hud=h=>document.getElementById("hud").innerHTML=`<div class="box">${h}</div>`;
const topbar=()=>document.getElementById("top").innerHTML=S.night===undefined?"":`<span>Night ${Math.min(S.night+1,5)} of 5</span><span>Guilt ${S.strikes}/3</span>`;
const QS=[{k:"where",q:"Where are you coming from?"},{k:"who",q:"Who is waiting for you?"},{k:"food",q:"What did you eat today?"},{k:"home",q:"Tell me about your home."}];
const ANS={where:{h:["The old mill road. My car died out past the creek.","From town. Everything there is boarded up now.","The farms out east. I walked since noon."],v:["From the road. The long road. The road.","From where the lights stop.","From out there. It was very warm. Now it is cold."],n:["I… I don’t know, I can’t think, I’m so cold."]},
who:{h:["My sister. She’s not answering her phone.","My dog, Biscuit. I had to leave him.","Nobody. That’s sort of the problem."],v:["Everyone is waiting. All of them. Together.","The family. They are very hungry for me to come home.","Someone who looks like you."],n:["P-please, I just need to sit down."]},
food:{h:["Half a sandwich, hours ago. I’m starving.","Canned peaches. Last of the cans.","Coffee. Just coffee."],v:["Food. I ate it. It was food.","Warm things. Soft things. Many.","I am not hungry. I mean, I am very hungry."],n:["Ugh, don’t ask me about food. I feel sick."]},
home:{h:["A little yellow house on Pine Street. Green door.","An apartment above the hardware shop.","A farm. Well, it was a farm."],v:["It has walls and a door. Like yours. Exactly like yours.","A house. Houses are good. Let me see yours.","It was a nice house. I remember the shape of it."],n:["Home… I just want to go home. Please."]}};
function ask(k){const p=S.p;if(!p||(p.asked&&p.asked[k])||!document.querySelector("#hud .atd"))return;p.asked=p.asked||{};p.asked[k]=1;const a=ANS[k],r=Math.random();p.line=pick(p.v?(r<.65?a.v:a.h):(r<.8?a.h:a.n));view();if(window.speechSynthesis)speechSynthesis.cancel();speak(p.line,p,1);if(p.v&&p.sg.includes("echo"))speak(p.line,p,.35)}
const fade=document.getElementById('fade'),ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
let AC=null,AN=null,EX=[];
const snd=(f0,f1,d,v,ty)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}};
const flash=(c,o,keep)=>{fade.style.transition='none';fade.style.background=c;fade.style.opacity=o;if(!keep)setTimeout(()=>{fade.style.transition='opacity .8s';fade.style.opacity=0},80)};
function anim(type,p,wrong,done){AN={type,t:0,v:p.v,wrong,done};if(type==='enter')snd(70,45,1,.25,'sawtooth')}
function stepAnim(dt){if(!AN)return;const a=AN;a.t+=dt;const T=a.t,g=P&&P.g;
 if(a.type==='leave'&&g){g.rotation.y=Math.min(Math.PI,T*4);if(T>.8)g.position.z-=dt*(a.v?2.4:1.5);const zz=g.position.z;g.position.y=zz>-4.9?.2:zz>-5.4?.1:0;if(a.wrong&&!a.s&&T>1.8){a.s=1;snd(600,1500,.8,.14,'sawtooth');flash('#7a0000',.4)}if(T>3.6){AN=null;a.done()}}
 else if(a.type==='enter'&&g){const o=T<3.2?ease(T):1-ease((T-3.2)/.8);dg.rotation.y=-1.4*o;if(T>1){const s=Math.min(1,(T-1)/2.4),z=-3+s*6.4;g.position.set(Math.min(1.1,Math.max(0,z+1.5)*.6),z>-.7?0:.2,z)}if(T>3.6)g.visible=false;if(T>4.1){dg.rotation.y=0;AN=null;a.done()}}
 else if(a.type==='kill'){dg.rotation.y=-1.4*ease(T/1.2);if(!a.c){a.c=1;snd(70,45,1.1,.3,'sawtooth')}cam.position.set(0,1.6,.3);yaw*=.9;tPitch*=.9;
  (a.mob?EX:[P]).forEach((q,i)=>{if(!q)return;const s=Math.min(1,Math.max(0,(T-1.2-i*.12)/1.5)),z=q.z0+s*s*(.1-q.z0);q.g.position.set(q.x0*(1-.85*s),z>-.7?0:.2,z)});
  const k=Math.min(1,Math.max(0,(T-2)/.7));cam.fov=58+24*k;cam.updateProjectionMatrix();cam.position.x+=(Math.random()-.5)*.06*k;
  if(T>2.75&&!a.f){a.f=1;flash('#8a0000',1,true);snd(500,1900,.6,.5,'sawtooth');snd(110,30,.5,.9,'sine')}
  if(T>2.95&&!a.b){a.b=1;fade.style.background='#000'}
  if(T>4&&!a.e){a.e=1;over()}}}
function kill(mob){if(window.speechSynthesis)speechSynthesis.cancel();document.getElementById('hud').innerHTML='';S.busy=1;EX=[];
 if(mob){if(P){scene.remove(P.g);P=null}EX=[-1.4,-.5,.5,1.4].map((x,i)=>{const q=makePerson(true,['still']);q.x0=x*.6;q.z0=-4-i*.3;q.g.position.set(q.x0,.2,q.z0);scene.add(q.g);return q})}else if(P){P.x0=0;P.z0=-3}
 peep(false);AN={type:'kill',t:0,mob}}
function resetWorld(){AN=null;if(S)S.busy=0;dg.rotation.y=0;fade.style.transition='none';fade.style.opacity=0;cam.fov=58;cam.updateProjectionMatrix();cam.position.set(0,1.6,.3);yaw=0;tPitch=0;pitch=0;EX.forEach(q=>scene.remove(q.g));EX=[];door.visible=true}
function peep(on){if(on&&S.away)return;const was=S.peep;S.peep=on;document.body.classList.toggle("peep",on);if(on){cam.position.set(0,1.6,-.6);cam.fov=95;if(document.exitPointerLock)document.exitPointerLock()}else{cam.position.set(0,1.6,.3);cam.fov=58;if(was)lock()}cam.updateProjectionMatrix();door.visible=!on;yaw=0;tPitch=0;pitch=0}
let voiceOn=true;
function toggleVoice(){voiceOn=!voiceOn;document.getElementById("mute").textContent=voiceOn?"🔊 (M)":"🔇 (M)";if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel()}
function speak(t,p,vol){if(!voiceOn||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith("en"));u.pitch=p.pitch;u.rate=.92;u.volume=vol;if(vs.length)u.voice=vs[p.vi%vs.length];speechSynthesis.speak(u)}
function sayPlea(p){if(S.p!==p)return;speak(p.plea,p,1);if(p.v&&p.sg.includes("echo"))speak(p.plea,p,.35)}
function title(){S={};resetWorld();if(P){scene.remove(P.g);P=null}topbar();hud(`<h1>Please Don’t Let Them In</h1><p>Visitors look almost human. Watch through the door window and decide who comes in. Your mouse controls the view like a first-person game (click to capture it). WASD walks. At the door, press SPACE to look through the peephole (this frees your mouse so you can click Open or Send away), and SPACE again to step back. SPACE also continues the dialogue. Esc frees your cursor too. Turn your sound on for voices.</p><button class="d" onclick="S={night:0,strikes:0};lock();night()">Begin (Space)</button>`)}
function night(){S.sigs=NIGHT_SIGNS[S.night];S.i=0;S.count=3+Math.min(S.night,2);topbar();
 hud(`<p>📻 <i>“…Tonight, Visitors may ${S.sigs.map(x=>SIGNS[x]).join("; ")}. Do not trust anyone who… [static]”</i></p><button class="d" onclick="person()">Go to the door (Space)</button>`)}
function person(){const v=Math.random()<.5,sg=shuf(S.sigs).slice(0,Math.random()<.5?2:1);S.p={v,sg,n:pick(NAMES),plea:pick(PLEAS),pitch:.8+Math.random()*.5,vi:Math.floor(Math.random()*9)};const pp=S.p;setPerson(makePerson(v,sg));knock();view();setTimeout(()=>sayPlea(pp),900)}
function view(){const p=S.p;if(!p.line)p.line=p.plea;const ec=p.v&&p.sg.includes("echo"),bub=document.getElementById("bub");bub.className="on";bub.innerHTML=`<b>${p.n}</b><br>“${p.line}”`;hud(`<p class="say sub">“${p.line}” <span class="mut">— ${p.n}</span></p>${ec?`<p class="echo sub" id="ec"></p>`:""}<p class="hint">Someone is knocking. Find the glowing door (WASD), then press SPACE to use the peephole.</p><div class="atd"><p class="mut">SPACE: peephole / step back · O: open door · G: send away · 1-4: ask</p><button onclick="peep(!S.peep)">👁 Peephole (Space)</button><br>${QS.map((q,i)=>`<button ${p.asked&&p.asked[q.k]?"disabled":""} onclick="ask('${q.k}')">${q.q} (${i+1})</button>`).join("")}<br><button onclick="decide(true)">🔓 Open door (O)</button><button class="d" onclick="decide(false)">🚫 Send away (G)</button></div>`);
 if(ec)setTimeout(()=>{if(S.p!==p)return;const e=document.getElementById("ec");if(e)e.textContent="“"+p.line+"”";bub.innerHTML+=`<br><span style="opacity:.5">“${p.line}”</span>`},700)}
function decide(letIn){const p=S.p;if(window.speechSynthesis)speechSynthesis.cancel();peep(false);document.getElementById("bub").className="";
 if(S.busy)return;if(letIn&&p.v)return kill(false);

 topbar();S.busy=1;document.getElementById("hud").innerHTML="";anim(letIn?"enter":"leave",p,wrong,()=>{S.busy=0;if(S.strikes>=3)return kill(true);
 scene.remove(P.g);P=null;S.i++;const last=S.i>=S.count;hud(`<button class="d" onclick="${last?"endNight()":"person()"}">${last?"Dawn":"Another knock…"} (Space)</button>`)})}
