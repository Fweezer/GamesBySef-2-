<div id="menu"><h1>Classic Tower Defense</h1><p>The dead are coming down the road. Build, upgrade and hold the line. Pick a mode.</p><div id="modes"></div><div id="lb"></div></div>

<script>
const T=50,W=18,H=10,$=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),R=Math.min(2,window.devicePixelRatio||1);cv.width=W*T*R;cv.height=H*T*R;
const MAPS=[

[[-1,5],[2,5],[2,1],[6,1],[6,8],[10,8],[10,1],[14,1],[14,5],[18,5]],
[[-1,1],[16,1],[16,3],[1,3],[1,5],[16,5],[16,7],[1,7],[1,9],[18,9]],
[[-1,8],[1,8],[1,1],[5,1],[5,6],[9,6],[9,1],[13,1],[13,6],[17,6],[17,3],[18,3]]];

{k:'Easy',col:'#5c9a45',lv:30,cash:400,hm:.8,b:.8,rw:1.1,wv:20,sh:0,pool:['walker','crawler','runner','brute'],boss:['hulk']},
{k:'Medium',col:'#c9a227',lv:20,cash:350,hm:1,b:1,rw:1,wv:30,sh:0,pool:['walker','crawler','runner','brute','armored','splitter','healer'],boss:['hulk','juggernaut']},
{k:'Hard',col:'#e07b39',lv:12,cash:300,hm:1.3,b:1.2,rw:.9,wv:40,sh:0,pool:['walker','crawler','runner','brute','armored','splitter','healer','screamer','bloater'],boss:['hulk','juggernaut','abomination']},
{k:'Nightmare',col:'#d0332a',lv:5,cash:250,hm:1.7,b:1.4,rw:.8,wv:50,sh:4,pool:['walker','crawler','runner','brute','armored','splitter','healer','screamer','bloater','ghost','demon','necro'],boss:['juggernaut','abomination','reaper']},
{k:'Apocalypse',col:'#a64dff',lv:3,cash:250,hm:2.4,b:1.7,rw:.75,wv:60,sh:6,pool:['crawler','runner','brute','armored','splitter','healer','screamer','bloater','ghost','demon','necro','revenant'],boss:['abomination','reaper','devourer']},
{k:'Extinction',col:'#ff1744',lv:1,cash:250,hm:3.4,b:2.1,rw:.7,wv:75,sh:9,pool:['crawler','runner','brute','armored','splitter','healer','screamer','bloater','ghost','demon','necro','revenant','lich'],boss:['reaper','devourer','harbinger']}];
Object.assign(Z,{revenant:{n:'Revenant',hp:260,s:1.6,a:12,$:30,r:11,c:'#8a2be2',l:2,w:10,ns:1},lich:{n:'Lich',hp:900,s:.8,a:6,$:50,r:14,c:'#2d8a8a',l:4,w:14,sum:1,heal:1},devourer:{n:'Devourer',boss:1,hp:32000,s:.55,a:18,$:1400,r:26,c:'#4a1048',l:60,reg:1,sp:['brute',6]},harbinger:{n:'Harbinger',boss:1,hp:60000,s:.65,a:22,$:2500,r:28,c:'#15101c',l:99,ns:1,reg:1,sp:['demon',3]}});
const TW={
gun:{n:'Gunner',g:'Damage',c:50,r:3,f:2.5,d:10,k:'b',col:'#c9a227',t:'Reliable all-rounder. Cheap and accurate.'},
mini:{n:'Minigun',c:140,r:2.6,f:9,d:4,k:'b',col:'#e07b39',t:'Huge fire rate with low damage per bullet.'},
shot:{n:'Shotgun',c:110,r:2.2,f:1.2,d:7,k:'sh',col:'#a8643a',t:'Fires a cone of five pellets. Brutal up close.'},
snip:{n:'Sniper',c:200,r:7,f:.55,d:75,k:'b',v:1000,col:'#2f6f8f',t:'Extreme range and heavy single hits. Shreds armor.'},

can:{n:'Cannon',c:160,r:3.2,f:.8,d:26,k:'b',sx:55,col:'#666a70',t:'Explosive shells with splash damage.'},
mort:{n:'Mortar',c:260,r:6.5,f:.33,d:60,k:'mo',sx:75,col:'#7a7a40',t:'Long-range artillery with a big blast. Slow shells.'},
rock:{n:'Missile Silo',c:340,r:5,f:.9,d:50,k:'b',sx:45,v:350,col:'#b23a48',t:'Fast homing missiles with splash.'},
flame:{n:'Flamethrower',c:180,r:1.9,f:10,d:2,k:'fl',burn:9,col:'#e8590c',t:'Cone of fire that ignites zombies. Burn ignores armor.'},
tesla:{n:'Tesla Coil',c:300,r:3,f:1.1,d:22,k:'ch',col:'#3bc9db',t:'Chain lightning jumps between up to four zombies.'},
laser:{n:'Laser',c:380,r:4,f:5,d:9,k:'bm',col:'#f03e3e',t:'Beam that ramps up the longer it stays on one target.'},
tox:{n:'Toxin Sprayer',c:150,r:3,f:1,d:3,k:'b',sx:40,pois:11,col:'#74b816',t:'Poison cloud deals damage over time and ignores armor.'},
frost:{n:'Cryo Tower',g:'Control',c:120,r:2.6,f:.8,d:4,k:'pu',slow:.5,col:'#74c0fc',t:'Chills every zombie in range, slowing them by half.'},
stun:{n:'Stun Pylon',c:230,r:2.8,f:.4,d:0,k:'pu',stun:.9,col:'#ffd43b',t:'Freezes zombies in place briefly. Bosses resist.'},
spot:{n:'Spotter',g:'Support',c:200,r:3,k:'au',a:'d',v:.25,col:'#e599f7',t:'Aura: nearby towers deal +25% damage.'},
cmd:{n:'Command Post',c:250,r:3,k:'au',a:'f',v:.25,col:'#ffa94d',t:'Aura: nearby towers fire 25% faster.'},
scope:{n:'Scope Tower',c:180,r:3,k:'au',a:'r',v:.2,col:'#69db7c',t:'Aura: nearby towers gain 20% range.'},
mark:{n:'Marker',c:220,r:3.5,k:'mk',col:'#ff8787',t:'Marked zombies take 30% more damage and lose 4 armor.'},
bank:{n:'Bank',c:250,r:0,k:'bk',col:'#a9e34b',t:'Pays $90 after every wave, +$60 per upgrade level.'}};
Object.assign(TW,{
evo1:{n:'Gatling Sentinel',g:'Evolved',ev:10,c:420,r:4.2,f:14,d:9,k:'b',v:1000,col:'#c77dff',t:'Evolved. Blistering homing gatling fire.'},
evo2:{n:'Plasma Cannon',ev:20,c:650,r:5,f:1.3,d:95,k:'b',sx:75,v:700,col:'#4dabf7',t:'Evolved. Plasma shells with a huge blast.'},
evo3:{n:'Storm Spire',ev:30,c:850,r:4.4,f:2,d:55,k:'ch',j:8,col:'#74f0ff',t:'Evolved. Lightning chains through eight zombies.'},
evo4:{n:'Void Lance',ev:40,c:1150,r:8,f:.9,d:280,k:'rail',col:'#9775fa',t:'Evolved. Colossal piercing beam across the map.'},
evo5:{n:'Armageddon Battery',ev:50,c:1800,r:7,f:1.6,d:190,k:'b',m3:3,sx:100,v:550,col:'#ff4d4d',t:'Evolved. Volleys of three homing warheads with enormous blasts.'}});
let cg;for(const k in TW){if(TW[k].g)cg=TW[k].g;TW[k].g=cg}
let S,E,B,SH,FX,TS,SQ,P,L,PL,blk,uid=0,sp0=0;
$('modes').innerHTML=MODES.map((m,i)=>`<button class="mc" style="border-color:${m.col}" onclick="pre(${i})"><h2 style="color:${m.col}">${m.k}</h2>${m.lv} lives, ${m.wv} waves, $${m.cash} to start<small>Zombies: ${m.pool.map(k=>Z[k].n).join(', ')}</small><small>Bosses: ${m.boss.map(k=>Z[k].n).join(', ')}</small></button>`).join('');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),adiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
function segd(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)));return Math.hypot(px-x1-t*dx,py-y1-t*dy)}
function start(mi){const m=MODES[mi];S={mi,m,lives:m.lv,cash:m.cash,n:0,sp:1,pause:0,over:0,inw:0,pick:null,sel:null,mx:-1,my:-1,lo:SV.lo.slice(),cd:16};E=[];B=[];SH=[];FX=[];TS=[];SQ=[];AL=[];PT=[];
P=MAPS[mi].map(([x,y])=>[x*T+T/2,y*T+T/2]);L=[];PL=0;blk=new Set;
for(let i=0;i<P.length-1;i++){L.push(Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]));PL+=L[i];const a=MAPS[mi][i],b=MAPS[mi][i+1];for(let x=Math.min(a[0],b[0]);x<=Math.max(a[0],b[0]);x++)for(let y=Math.min(a[1],b[1]);y<=Math.max(a[1],b[1]);y++)blk.add(y*100+x)}
$('menu').hidden=1;$('lo').hidden=1;$('game').hidden=0;$('ov').hidden=1;$('spd').textContent='Speed 1×';$('ps').textContent='Pause';mkbg();shop();info();hud()}
function pos(d){let i=0;while(i<L.length-1&&d>L[i]){d-=L[i];i++}const a=P[i],b=P[i+1],t=Math.max(0,Math.min(1,d/L[i]));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function mk(k,d=0){const z=Z[k],h=z.hp*S.m.hm*(1+S.n*.035),[x,y]=pos(d);return{k,z,hp:h,m:h,d,x,y,sl:0,sv:1,bt:0,bd:0,pt:0,pd:0,mk:0,st:0,t:0,sc:0}}
function mkWave(n){const m=S.m;let av=m.pool.filter(k=>Z[k].w<=n+m.sh);if(!av.length)av=[m.pool[0]];const q=[];let b=(60+n*45+n*n*3)*m.b;
while(b>0){const k=av[Math.min(av.length-1,Math.floor(Math.random()*av.length*(.6+Math.random()*.7)))];q.push(k);b-=Z[k].hp}
if(n%5==0){const bi=Math.min(m.boss.length-1,Math.floor((n-1)/(m.wv/m.boss.length)));for(let i=0;i<1+(n/25|0);i++)q.push(m.boss[bi])}return q}
const stats=t=>{const s=TW[t.k],l=t.l-1,G=t.gold&&!['au','bk','mk','sp'].includes(s.k);return{r:s.r*T*(1+.07*l)*(1+t.b.r)*(G?1.1:1),f:s.f*(1+.15*l)*(1+t.b.f)*(G?1.1:1)*(t.rf>0?2:1),d:s.d*(1+.6*l)*(1+t.b.d)*(G?1.2:1)*(t.ov>0?2.5:1)}};
function hit(e,d,raw){if(e.hp<=0)return;if(!raw){const a=Math.max(0,e.z.a-(e.mk>0?(e.mg?8:4):0));d=Math.max(d-a,d*.2);if(e.mk>0)d*=e.mg?1.5:1.3}e.hp-=d;if(e.hp<=0)kill(e)}
function kill(e){if(e.dead)return;e.dead=1;ptc(e.x,e.y,e.z.c,e.z.boss?40:9,e.z.boss?120:60,.6);S.cash+=Math.round(e.z.$*S.m.rw);if(e.z.sp)for(let i=0;i<e.z.sp[1];i++)E.push(mk(e.z.sp[0],Math.max(0,e.d-i*14)))}
function boom(x,y,sx,dm,po,c){FX.push({k:'ex',x,y,r:sx,t:.25,c});for(const o of E)if(o.hp>0&&Math.hypot(o.x-x,o.y-y)<=sx+o.z.r){hit(o,dm);if(po){o.pt=3.5;o.pd=Math.max(o.pd,po)}}}
function tgt(t,r){let best=null,bs=-1e9;for(const e of E){const q=dist(t,e);if(e.hp<=0||q>r+e.z.r)continue;const sc=t.tm==0?e.d:t.tm==1?e.m:t.tm==2?-e.d:-q;if(sc>bs){bs=sc;best=e}}return best}
